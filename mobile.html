<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101214" />
  <title>BoltWorks Mobile Studio</title>
  <link rel="icon" type="image/png" href="./app/assets/branding/boltworks-logo.png" />
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #101214; color: #eef2f3; }
    main { width: min(88vw, 380px); display: grid; justify-items: center; gap: 14px; text-align: center; }
    img { width: 64px; height: 64px; object-fit: contain; }
    a { color: #40c7a5; }
  </style>
  <script>
    const target = new URL("./index.html", location.href);
    target.searchParams.set("mobile", "1");
    target.hash = location.hash;
    location.replace(target.href);
  </script>
</head>
<body>
  <main>
    <img src="./app/assets/branding/boltworks-logo.png" alt="BoltWorks" />
    <strong>Opening BoltWorks Mobile Studio…</strong>
    <a href="./index.html?mobile=1">Open the mobile studio</a>
  </main>
</body>
</html>
